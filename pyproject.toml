[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philiprehberger-webhook-signature"
version = "0.2.1"
description = "HMAC-based webhook signature generation and verification with timing-safe comparison"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Philip Rehberger" }]
keywords = ["webhook", "hmac", "signature", "verification", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/philiprehberger/py-webhook-signature#readme"
Repository = "https://github.com/philiprehberger/py-webhook-signature"
Issues = "https://github.com/philiprehberger/py-webhook-signature/issues"
Changelog = "https://github.com/philiprehberger/py-webhook-signature/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/philiprehberger_webhook_signature"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
